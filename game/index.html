<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>EMBERLINE — Fire Season</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; pointer-events: auto; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #ff8a7a; font: 13px system-ui, sans-serif; z-index: 3; }
</style>
</head>
<body>
<canvas id="gl" aria-label="EMBERLINE: fly the air tanker over a burning valley"></canvas>
<canvas id="hud" aria-label="Flight instruments and menus"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="err"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
